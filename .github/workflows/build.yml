name: Build

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-macos-app:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./scripts/build-app.sh

      - name: Test macOS app
        run: |
          TODAYBAR_TEST_LANGUAGE=ru ./scripts/test.sh
          TODAYBAR_TEST_LANGUAGE=en ./scripts/test.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Today.app Today-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Today-universal
          path: Today-universal.zip

  windows-app:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test domain and storage
        run: dotnet run --project Windows/Today.Core.Tests -c Release
      - name: Test native Windows interface
        timeout-minutes: 3
        shell: pwsh
        run: |
          dotnet build Windows/Today.Windows -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process Windows/Today.Windows/bin/Release/net10.0-windows/Today.exe -ArgumentList '--smoke-test', '.build/windows-previews' -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Upload Windows interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Today-Windows-previews
          path: .build/windows-previews
          if-no-files-found: warn
      - name: Build Windows x64 and ARM64
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Runtime win-x64
          ./scripts/build-windows.ps1 -Runtime win-arm64
      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Today-windows-x64
          path: dist/Today-win-x64/Today.exe
      - name: Upload Windows ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Today-windows-arm64
          path: dist/Today-win-arm64/Today.exe
